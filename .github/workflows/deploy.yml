name: Deploy Backend

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_deploy:
        description: "Run production deploy over SSH"
        required: false
        type: boolean
        default: false

concurrency:
  group: production-deploy
  # Never cancel a deploy that is already running. Cancelling mid-`docker
  # compose up --build` leaves the server with a half-built image set and some
  # containers on the old release; queueing the next run instead costs a few
  # minutes and always lands on a consistent state. This mattered little while
  # deploys were manual and rare — with every merge deploying, back-to-back
  # merges would otherwise interrupt each other.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Linux server
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Push events are already filtered to main by the `on:` trigger above, so
    # every merge into main deploys. Manual runs still have to tick run_deploy,
    # which keeps a stray workflow_dispatch from redeploying by accident.
    if: ${{ github.event_name == 'push' || inputs.run_deploy }}

    # Configure these GitHub repository secrets before enabling production deploys:
    # - SERVER_HOST: public IP address or domain name of the Linux server
    # - SERVER_USER: SSH username on the Linux server
    # - SERVER_SSH_KEY: private SSH key with deployment access to the Linux server
    # - SERVER_PORT: SSH port; optional because this workflow defaults to 22
    # - PROJECT_PATH: absolute path to the cloned repo on the server
    env:
      PROJECT_PATH: ${{ secrets.PROJECT_PATH }}

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          envs: PROJECT_PATH
          script_stop: true
          command_timeout: 20m
          script: |
            set -eu

            cd "$PROJECT_PATH"
            git pull origin main

            docker compose -f docker-compose.prod.yml up -d --build

            docker image prune -f
