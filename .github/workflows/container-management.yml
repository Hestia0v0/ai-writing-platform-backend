name: Container Management

on:
  workflow_dispatch:
    inputs:
      enforce_trivy_gate:
        description: "Fail workflow when Trivy finds HIGH/CRITICAL vulnerabilities (auto-enforced on push to main)"
        required: false
        type: boolean
        default: false
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  build-store-scan:
    name: Build/Store/Scan (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api_gateway
          - ai_inference
          - knowledge_retrieval
          - pipelines
          - agents

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Normalize image owner
        id: owner
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.owner.outputs.value }}/ai-writing-platform-backend-${{ matrix.service }}
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (+push on non-PR events)
        uses: docker/build-push-action@v6
        with:
          context: backend/${{ matrix.service }}
          file: backend/${{ matrix.service }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ steps.owner.outputs.value }}/ai-writing-platform-backend-${{ matrix.service }}:sha-${{ github.sha }}
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Count Trivy findings
        id: trivy_counts
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          sarif_path = Path("trivy-${{ matrix.service }}.sarif")
          findings = 0
          if sarif_path.exists():
              data = json.loads(sarif_path.read_text(encoding="utf-8"))
              for run in data.get("runs", []):
                  findings += len(run.get("results", []))

          print(f"Trivy findings for ${{ matrix.service }}: {findings}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"count={findings}\n")
          PY

      - name: Enforce Trivy gate
        # Auto-enforce on push to main branch; manual opt-in otherwise via workflow_dispatch.
        if: |
          steps.trivy_counts.outputs.count != '0' && (
            (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
            (github.event_name == 'workflow_dispatch' && inputs.enforce_trivy_gate)
          )
        run: |
          echo "Trivy found HIGH/CRITICAL vulnerabilities for ${{ matrix.service }} (count=${{ steps.trivy_counts.outputs.count }})."
          echo "Review SARIF in Security tab/artifacts."
          echo "Trigger: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'auto-block (main push)' || 'manual opt-in' }}"
          exit 1

      - name: Upload Trivy SARIF
        if: ${{ always() && hashFiles(format('trivy-{0}.sarif', matrix.service)) != '' }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif

      - name: Upload Trivy SARIF as artifact
        if: ${{ always() && hashFiles(format('trivy-{0}.sarif', matrix.service)) != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ matrix.service }}-sarif
          path: trivy-${{ matrix.service }}.sarif
          if-no-files-found: ignore
