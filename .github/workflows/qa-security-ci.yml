name: QA + Security CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests and Coverage (with JUnit/HTML artifacts)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:////tmp/ai_inference_ci.sqlite
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare artifact directory
        run: mkdir -p artifacts/unit

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/api_gateway/requirements.txt
            backend/ai_inference/requirements.txt
            backend/pipelines/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/api_gateway/requirements.txt
          pip install -r backend/ai_inference/requirements.txt
          pip install -r backend/pipelines/requirements.txt
          pip install pytest pytest-cov httpx pytest-asyncio pyjwt

      - name: Run unit tests and generate JUnit XML
        id: unit_tests
        continue-on-error: true
        run: |
          pytest \
            tests/unit/test_api_gateway.py \
            tests/unit/test_ai_inference.py \
            tests/unit/test_pipelines_doc_processor.py \
            tests/unit/test_response_mapping.py \
            -v --tb=short \
            --junitxml=artifacts/unit/pytest-unit.xml \
            --cov=backend/api_gateway \
            --cov=backend/ai_inference \
            --cov=backend/pipelines \
            --cov-report=term-missing \
            --cov-report=html:artifacts/unit/coverage-html \
            --cov-report=xml:artifacts/unit/coverage.xml \
            --cov-report=json:artifacts/unit/coverage.json

          coverage html --directory=artifacts/unit/coverage-html/api_gateway \
            --include='backend/api_gateway/*'
          coverage html --directory=artifacts/unit/coverage-html/ai_inference \
            --include='backend/ai_inference/*'
          coverage html --directory=artifacts/unit/coverage-html/pipelines \
            --include='backend/pipelines/*'

      - name: Publish coverage summary by microservice
        if: steps.unit_tests.outcome == 'success'
        run: |
          python - <<'PY'
          import json
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          junit = ET.parse("artifacts/unit/pytest-unit.xml").getroot()
          coverage = json.loads(Path("artifacts/unit/coverage.json").read_text())
          suites = list(junit.iter("testsuite"))
          cases = list(junit.iter("testcase"))

          def test_stats(prefixes):
              selected = [
                  case for case in cases
                  if any(case.get("classname", "").startswith(prefix) for prefix in prefixes)
              ]
              failed = sum(case.find("failure") is not None or case.find("error") is not None for case in selected)
              skipped = sum(case.find("skipped") is not None for case in selected)
              return len(selected), len(selected) - failed - skipped

          def coverage_stats(service):
              prefix = f"backend/{service}/"
              summaries = [
                  details["summary"] for filename, details in coverage["files"].items()
                  if filename.startswith(prefix)
              ]
              statements = sum(item["num_statements"] for item in summaries)
              covered = sum(item["covered_lines"] for item in summaries)
              percent = covered / statements * 100 if statements else 0
              return statements, covered, round(percent)

          services = [
              ("API Gateway", "api_gateway", ("tests.unit.test_api_gateway",)),
              ("AI Inference", "ai_inference", ("tests.unit.test_ai_inference",)),
              (
                  "Pipelines",
                  "pipelines",
                  (
                      "tests.unit.test_pipelines_doc_processor",
                      "tests.unit.test_response_mapping",
                  ),
              ),
          ]

          total_tests = sum(int(suite.get("tests", 0)) for suite in suites)
          failures = sum(int(suite.get("failures", 0)) for suite in suites)
          errors = sum(int(suite.get("errors", 0)) for suite in suites)
          skipped = sum(int(suite.get("skipped", 0)) for suite in suites)
          passed = total_tests - failures - errors - skipped
          totals = coverage["totals"]

          lines = [
              "# Backend Unit Test and Coverage Report",
              "",
              f"**Commit:** `{os.environ['GITHUB_SHA'][:7]}`  ",
              f"**Result:** {passed}/{total_tests} unit tests passed",
              "",
              "| Scope | Unit tests | Passed | Statements | Covered | Coverage |",
              "|---|---:|---:|---:|---:|---:|",
              (
                  f"| **Overall** | **{total_tests}** | **{passed}** | "
                  f"**{totals['num_statements']}** | **{totals['covered_lines']}** | "
                  f"**{totals['percent_covered']:.0f}%** |"
              ),
          ]

          for title, service, prefixes in services:
              tests, service_passed = test_stats(prefixes)
              statements, covered, percent = coverage_stats(service)
              lines.append(
                  f"| {title} | {tests} | {service_passed} | {statements} | {covered} | {percent}% |"
              )

          lines.extend([
              "",
              "> Generated during this GitHub Actions run from pytest JUnit XML and coverage.py JSON artifacts.",
              "",
          ])
          report = "\n".join(lines)
          Path("artifacts/unit/coverage-summary.md").write_text(report)
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as summary:
              summary.write(report)
          PY

      - name: Ensure unit artifacts exist
        if: always()
        run: |
          touch artifacts/unit/.keep
          mkdir -p artifacts/unit/coverage-html
          if [ ! -f artifacts/unit/pytest-unit.xml ]; then
            cat <<'EOF' > artifacts/unit/pytest-unit.xml
          <testsuite name="unit-tests" tests="0" failures="1">
            <testcase classname="workflow" name="pytest_not_executed_or_failed_early">
              <failure message="pytest did not produce JUnit XML">See job logs for root cause.</failure>
            </testcase>
          </testsuite>
          EOF
          fi

      - name: Upload unit test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: artifacts/unit/
          if-no-files-found: warn

  integration-tests:
    name: Integration Tests (with JUnit artifact)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare artifact directory
        run: mkdir -p artifacts/integration

      - name: Start docker-compose stack
        working-directory: infrastructure
        run: |
          cp .env.example .env
          docker compose up -d --wait

      - name: Wait for gateway health
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8000/health/ > /dev/null; then
              echo "Gateway is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Gateway did not become ready in time"
          exit 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest httpx pyjwt

      - name: Run integration tests and generate JUnit XML
        id: integration_tests
        continue-on-error: true
        run: |
          pytest tests/integration -v -m integration --tb=short \
            --junitxml=artifacts/integration/pytest-integration.xml

      - name: Ensure integration artifacts exist
        if: always()
        run: |
          touch artifacts/integration/.keep
          if [ ! -f artifacts/integration/pytest-integration.xml ]; then
            cat <<'EOF' > artifacts/integration/pytest-integration.xml
          <testsuite name="integration-tests" tests="0" failures="1">
            <testcase classname="workflow" name="pytest_not_executed_or_failed_early">
              <failure message="pytest did not produce JUnit XML">See job logs for root cause.</failure>
            </testcase>
          </testsuite>
          EOF
          fi

      - name: Capture docker compose logs
        if: always()
        working-directory: infrastructure
        run: |
          mkdir -p ../artifacts/integration
          docker compose logs --no-color > ../artifacts/integration/docker-compose.log

      - name: Stop docker-compose stack
        if: always()
        working-directory: infrastructure
        run: docker compose down -v

      - name: Upload integration artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: artifacts/integration/
          if-no-files-found: warn

  load-stress-tests:
    name: Load/Stress Tests (Locust artifacts)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare artifact directory
        run: mkdir -p artifacts/load

      - name: Start docker-compose stack
        working-directory: infrastructure
        run: |
          cp .env.example .env
          docker compose up -d --wait

      - name: Wait for gateway health
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8000/health/ > /dev/null; then
              echo "Gateway is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Gateway did not become ready in time"
          exit 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install load test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install locust pyjwt

      - name: Run Locust and export reports
        id: load_tests
        continue-on-error: true
        run: |
          locust -f tests/performance/locust_ci.py \
            --host http://localhost:8000 \
            --users 10 \
            --spawn-rate 2 \
            --run-time 1m \
            --headless \
            --exit-code-on-error 0 \
            --html artifacts/load/locust-report.html \
            --csv artifacts/load/locust

      - name: Ensure load artifacts exist
        if: always()
        run: |
          touch artifacts/load/.keep
          if [ ! -f artifacts/load/locust-report.html ]; then
            cat <<'EOF' > artifacts/load/locust-report.html
          <html><body><h1>Locust report missing</h1><p>Locust did not produce HTML report; see job logs.</p></body></html>
          EOF
          fi

      - name: Capture docker compose logs
        if: always()
        working-directory: infrastructure
        run: |
          mkdir -p ../artifacts/load
          docker compose logs --no-color > ../artifacts/load/docker-compose.log

      - name: Stop docker-compose stack
        if: always()
        working-directory: infrastructure
        run: docker compose down -v

      - name: Upload load/stress artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-stress-test-results
          path: artifacts/load/
          if-no-files-found: warn

  sast:
    name: SAST (Bandit + Semgrep artifacts)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SAST dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit semgrep

      - name: Run Bandit (JSON + text reports)
        run: |
          mkdir -p artifacts/sast
          bandit -r backend -f json -o artifacts/sast/bandit.json || true
          bandit -r backend -f txt -o artifacts/sast/bandit.txt || true

      - name: Run Semgrep (SARIF + JSON reports)
        run: |
          semgrep scan --config auto --sarif --output artifacts/sast/semgrep.sarif backend tests || true
          semgrep scan --config auto --json --output artifacts/sast/semgrep.json backend tests || true

      - name: Upload SAST artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-results
          path: artifacts/sast/
          if-no-files-found: error

  dast:
    name: DAST (OWASP ZAP artifacts)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare artifact directory
        run: mkdir -p artifacts/dast

      - name: Start docker-compose stack
        working-directory: infrastructure
        run: |
          cp .env.example .env
          docker compose up -d --wait

      - name: Run OWASP ZAP baseline scan
        run: |
          set +e
          docker run --rm \
            --add-host=host.docker.internal:host-gateway \
            -v "${{ github.workspace }}:/zap/wrk" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://host.docker.internal:8000 \
            -J /zap/wrk/artifacts/dast/zap-report.json \
            -r /zap/wrk/artifacts/dast/zap-report.html \
            -w /zap/wrk/artifacts/dast/zap-report.md \
            -x /zap/wrk/artifacts/dast/zap-report.xml \
            -m 3
          echo $? > artifacts/dast/zap-exit-code.txt
          ls artifacts/dast > /dev/null
          set -e

      - name: Capture docker compose logs
        if: always()
        working-directory: infrastructure
        run: |
          mkdir -p ../artifacts/dast
          docker compose logs --no-color > ../artifacts/dast/docker-compose.log

      - name: Stop docker-compose stack
        if: always()
        working-directory: infrastructure
        run: docker compose down -v

      - name: Upload DAST artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dast-results
          path: artifacts/dast/
          if-no-files-found: error
