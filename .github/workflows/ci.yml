name: Full Backend CI

# ── 触发说明 ─────────────────────────────────────────────────────────────────
# 本 workflow 为「完整后端 CI」—— 相较于 backend-ci.yml 的纯单元测试最小门禁，
# 这里跑全服务矩阵单测（含 Postgres/Redis 服务容器）、Docker 镜像冒烟构建和
# 集成测试，适合在合并前手动触发做全面验证。
#
# 不绑定 push / pull_request 的原因：
#   1. 需要启动 Postgres + Redis 服务容器，运行时间较长（≈8-15 min）；
#   2. 部分服务（knowledge_retrieval）依赖 fastembed 模型下载，网络波动可能导致
#      偶发失败，不适合作为阻塞性门禁；
#   3. 集成测试需要 docker compose 启动完整服务栈。
#
# 日常自动门禁请使用 backend-ci.yml（纯单元测试，SQLite，2 min 内完成）。
# ──────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:

jobs:
  # ─── 全服务后端单测矩阵 ─────────────────────────────────────────────────
  test-backend:
    name: Unit Tests (${{ matrix.service }})
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform
          POSTGRES_DB: platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        service:
          - api_gateway
          - ai_inference
          - knowledge_retrieval
          - pipelines
          - agents

    env:
      DATABASE_URL: postgresql://platform:platform@localhost:5432/platform
      POSTGRES_DSN: postgresql://platform:platform@localhost:5432/platform
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-full-test-secret

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/${{ matrix.service }}/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/${{ matrix.service }}/requirements.txt
          pip install pytest httpx pytest-asyncio

      - name: Run unit tests for ${{ matrix.service }}
        id: unit_tests
        # knowledge_retrieval 需要下载 fastembed 模型，pipelines 的 TestClient
        # 在模块级 import main（触发 asyncpg lifespan），网络波动或模型下载失败
        # 不应让整个矩阵 job 变红；失败信息在日志中可见。
        continue-on-error: ${{ matrix.service == 'knowledge_retrieval' || matrix.service == 'pipelines' }}
        run: |
          pytest tests/unit/test_${{ matrix.service }}.py -v --tb=short

      - name: Report skipped/failed (non-blocking services)
        if: ${{ always() && steps.unit_tests.outcome == 'failure' }}
        run: |
          echo "::warning::${{ matrix.service }} unit tests failed or were skipped."
          echo "Check logs above for details (possible network/model-download issue)."

  # ─── Docker 镜像冒烟构建 ──────────────────────────────────────────────
  build-docker:
    name: Docker Build (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [test-backend]
    strategy:
      fail-fast: false
      matrix:
        service:
          - api_gateway
          - ai_inference
          - knowledge_retrieval
          - pipelines
          - agents
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image for ${{ matrix.service }}
        run: |
          docker build -t platform/${{ matrix.service }}:ci backend/${{ matrix.service }}

  # ─── 集成测试 ──────────────────────────────────────────────────────────
  integration-tests:
    name: Integration Tests (docker compose)
    runs-on: ubuntu-latest
    needs: [build-docker]
    steps:
      - uses: actions/checkout@v4

      - name: Start docker compose stack
        working-directory: infrastructure
        run: |
          cp .env.example .env
          docker compose up -d --wait

      - name: Wait for gateway health
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8000/health/ > /dev/null; then
              echo "Gateway is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Gateway did not become ready in time"
          exit 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest httpx pyjwt

      - name: Run integration tests
        run: |
          pytest tests/integration/ -v -m integration --tb=short

      - name: Capture docker compose logs
        if: always()
        working-directory: infrastructure
        run: |
          mkdir -p artifacts/integration
          docker compose logs --no-color > artifacts/integration/docker-compose.log

      - name: Upload integration logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-ci-integration-logs
          path: artifacts/integration/
          if-no-files-found: warn

      - name: Tear down services
        if: always()
        working-directory: infrastructure
        run: docker compose down -v
