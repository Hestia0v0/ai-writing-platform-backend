networks:
  platform_net:
    driver: bridge

volumes:
  redis_data:     # Railway Redis 方案：删除此行
  postgres_data:

services:
  # ─── Frontend ──────────────────────────────────────────────
  frontend:
    profiles: ["frontend"]
    build:
      context: ../../ai-writing-platform-frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_GATEWAY_URL=http://localhost:8000
    ports:
      - "${FRONTEND_PORT:-3001}:3000"
    depends_on:
      - api_gateway
    networks:
      - platform_net
    restart: unless-stopped

  # ─── API Gateway ───────────────────────────────────────────
  api_gateway:
    build:
      context: ../backend/api_gateway
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./certs:/certs:ro
    environment:
      - AI_INFERENCE_URL=http://ai_inference:8001
      - KNOWLEDGE_RETRIEVAL_URL=http://knowledge_retrieval:8002
      - PIPELINES_URL=http://pipelines:8003
      - AGENTS_URL=http://agents:8004
      - POSTGRES_DSN=postgresql://${POSTGRES_USER:-platform}:${POSTGRES_PASSWORD:-platform}@postgres:5432/${POSTGRES_DB:-platform}
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - SUPER_ADMIN_EMAIL=${SUPER_ADMIN_EMAIL:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://localhost:3001}
      - REDIS_URL=redis://redis:6379/2
      # Railway Redis：将上一行替换为：
      # - REDIS_URL=${REDIS_GATEWAY_URL}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - STRIPE_PRICE_BASIC=${STRIPE_PRICE_BASIC:-}
      - STRIPE_PRICE_PRO=${STRIPE_PRICE_PRO:-}
      - SMTP_HOST=${SMTP_HOST:-smtp.qq.com}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-AI Writing Platform}
      - SMTP_USE_SSL=${SMTP_USE_SSL:-true}
      - SMTP_TIMEOUT_SECONDS=${SMTP_TIMEOUT_SECONDS:-10}
      - EMAIL_CODE_TTL_SECONDS=${EMAIL_CODE_TTL_SECONDS:-600}
      - EMAIL_CODE_COOLDOWN_SECONDS=${EMAIL_CODE_COOLDOWN_SECONDS:-60}
      - EMAIL_CODE_MAX_ATTEMPTS=${EMAIL_CODE_MAX_ATTEMPTS:-5}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      ai_inference:
        condition: service_started
      knowledge_retrieval:
        condition: service_started
      pipelines:
        condition: service_started
    networks:
      - platform_net
    restart: unless-stopped

  # ─── Agents Service ────────────────────────────────────────
  agents:
    profiles: ["ai"]
    build:
      context: ../backend/agents
      dockerfile: Dockerfile
    ports:
      - "8004:8004"
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - GUARDRAIL_MODEL=${GUARDRAIL_MODEL:-deepseek-chat}
      - DRAFTING_MODEL=${DRAFTING_MODEL:-deepseek-chat}
      - EVAL_MODEL=${EVAL_MODEL:-deepseek-chat}
      - REFINEMENT_MODEL=${REFINEMENT_MODEL:-deepseek-chat}
      - EVAL_FALLBACK_MODEL=${EVAL_FALLBACK_MODEL:-deepseek-reasoner}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - EVAL_FALLBACK_ANTHROPIC_MODEL=${EVAL_FALLBACK_ANTHROPIC_MODEL:-claude-haiku-4-5}
      - ARBITRATION_STDEV_THRESHOLD=${ARBITRATION_STDEV_THRESHOLD:-6.0}
      - KNOWLEDGE_RETRIEVAL_URL=http://knowledge_retrieval:8002
      - REDIS_URL=redis://redis:6379/3
    depends_on:
      knowledge_retrieval:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - platform_net
    restart: unless-stopped

  # ─── AI Inference ──────────────────────────────────────────
  ai_inference:
    build:
      context: ../backend/ai_inference
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    volumes:
      - ./certs:/certs:ro
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - REDIS_URL=redis://redis:6379/0
      # Railway Redis：将上一行替换为：
      # - REDIS_URL=${REDIS_INFERENCE_URL}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-platform}:${POSTGRES_PASSWORD:-platform}@postgres:5432/${POSTGRES_DB:-platform}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - platform_net
    restart: unless-stopped

  # ─── Knowledge Retrieval ───────────────────────────────────
  knowledge_retrieval:
    build:
      context: ../backend/knowledge_retrieval
      dockerfile: Dockerfile
    ports:
      - "8002:8002"
    volumes:
      - ./certs:/certs:ro
    environment:
      - POSTGRES_DSN=postgresql://${POSTGRES_USER:-platform}:${POSTGRES_PASSWORD:-platform}@postgres:5432/${POSTGRES_DB:-platform}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - platform_net
    restart: unless-stopped

  # ─── Pipelines ─────────────────────────────────────────────
  pipelines:
    build:
      context: ../backend/pipelines
      dockerfile: Dockerfile
    ports:
      - "8003:8003"
    volumes:
      - ./certs:/certs:ro
    environment:
      - REDIS_URL=redis://redis:6379/1
      # Railway Redis：将上一行替换为：
      # - REDIS_URL=${REDIS_PIPELINES_URL}
      - AI_INFERENCE_URL=http://ai_inference:8001
      - AGENTS_URL=http://agents:8004
      - KNOWLEDGE_RETRIEVAL_URL=http://knowledge_retrieval:8002
      - POSTGRES_DSN=postgresql://${POSTGRES_USER:-platform}:${POSTGRES_PASSWORD:-platform}@postgres:5432/${POSTGRES_DB:-platform}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      ai_inference:
        condition: service_started
      knowledge_retrieval:
        condition: service_started
    networks:
      - platform_net
    restart: unless-stopped

  # ─── PostgreSQL + pgvector ────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-platform-local}
      POSTGRES_DB: ${POSTGRES_DB:-platform}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-platform} -d ${POSTGRES_DB:-platform}"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      - platform_net
    restart: unless-stopped

  # ─── Redis ────────────────────────────────────────────────
  # Railway Redis 方案：删除以下整个 redis 服务块。
  # 切换前请先在 Railway 控制台创建 Redis 服务并获取连接串（含密码和端口），
  # 然后在 .env 中填写 REDIS_INFERENCE_URL / REDIS_PIPELINES_URL / REDIS_GATEWAY_URL。
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - platform_net
    restart: unless-stopped
